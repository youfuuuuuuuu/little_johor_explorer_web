<!DOCTYPE html>
<html>

<head>
  <base href="/little_johor_explorer_web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Little Johor Explorer">

  <title>Little Johor Explorer</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #loading.flutter-loaded {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #efefef;
      border-top: 4px solid black;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    p {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>

</head>

<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Loading...</p>
</div>

<script>
  // Removes the loading overlay once Flutter Web renders its first frame.
  window.addEventListener('flutter-first-frame', function () {
    var loading = document.getElementById('loading');
    if (loading) {
      loading.classList.add('flutter-loaded');
      setTimeout(function () {
        loading.remove();
      }, 300);
    }
  });
</script>

<!-- CRITICAL: this script actually boots the Flutter engine.
     Do not remove it -- without this line nothing will ever render. -->
<script src="flutter_bootstrap.js" async></script>

</body>

</html>
